[build]
builder = "RAILPACK"
buildCommand = "python -m pip install -r requirements.txt && python -m pip install jsonschema && sed -i '772d' backend/orchestration/orchestrator.py"

[deploy]
startCommand = "python -m uvicorn backend.api.app:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
